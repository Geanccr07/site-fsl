<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- Fonte -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->

<body class="page-home">

<header>
  <nav class="container">

    <a href="/blog">Blog</a>
    <a href="/materiais-gratuitos">Conteúdo gratuito</a>
  </nav>
</header>

<section class="hero container">
  <div>
    <h1>Do zero ao primeiro emprego na sua área.</h1>
    <p>
  Comunidade ativa e preparação real para processos seletivos - 
  <span class="highlight">tudo gratuito</span>
    </p>

<form>
  <h3 class="form-title">
    Preencha seus dados para entrar na comunidade gratuita
  </h3>

  <label>Nome
    <input type="text" required>
  </label>

  <label>Email
    <input type="email" required>

  <label>WhatsApp
    <input type="tel" required>
  </label>

  <label>Área de estudo
    <select>
      <option>Selecione</option>
      <option>Marketing</option>
      <option>Dados</option>
      <option>Tecnologia</option>
      <option>Outro</option>
    </select>
  </label>

  <button type="submit">Quero dar o primeiro passo</button>
</form>

</section>
