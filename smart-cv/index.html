<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerar currículo otimizado para vaga</title>

  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="page-default smart-cv">

<section class="section">
  <div class="container" style="max-width: 720px;">

    <h1>Gerar currículo otimizado para a vaga</h1>

    <p style="margin-bottom: 2.5rem;">
      Envie seu currículo e a descrição da vaga.  
      Você receberá o currículo adaptado por e-mail.
    </p>

    <form id="cvForm" class="form-box">

      <label>
        Seu e-mail
        <input type="email" name="email" required placeholder="seuemail@email.com">
      </label>

      <label>
        Envie seu currículo (PDF ou DOCX)
        <input type="file" name="curriculo" accept=".pdf,.doc,.docx" required>
      </label>

      <label>
        Cole a descrição da vaga
        <textarea
          name="vaga"
          rows="10"
          placeholder="Cole aqui a descrição da vaga completa"
          required
        ></textarea>
      </label>

      <button type="submit">
        Gerar currículo personalizado
      </button>

    </form>

    <p id="statusMsg" style="display:none; margin-top:2rem;"></p>

  </div>
</section>

<script>
  const form = document.getElementById('cvForm');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);

    statusMsg.style.display = 'block';
    statusMsg.innerText = 'Enviando...';

    try {
      await fetch('http://localhost:5678/webhook/gerar-cv', {
        method: 'POST',
        body: formData
      });

      form.style.display = 'none';
      statusMsg.innerText =
        '✅ Tudo certo! Aguarde alguns minutos para receber seu currículo atualizado no e-mail informado.';

    } catch (err) {
      statusMsg.innerText =
        '❌ Ocorreu um erro. Tente novamente.';
    }
  });
</script>

</body>
</html>
