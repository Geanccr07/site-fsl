<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gere seu currículo otimizado em segundos</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="page-default smart-cv">

<section class="section">
  <div class="container">

    <h1>Gere seu currículo otimizado em segundos</h1>

    <p>
      Envie seu currículo e a descrição da vaga.  
      Você receberá o currículo adaptado para ATS via e-mail.
    </p>

    <form id="cvForm" class="form-box">

      <label>
        Seu nome
        <input type="text" name="nome" required placeholder="Seu nome completo">
      </label>

      <label>
        Nome da vaga
        <input type="text" name="nome_vaga" required placeholder="Ex: Analista de Dados Júnior">
      </label>

      <label>
        Seu e-mail
        <input type="email" name="email" required placeholder="seuemail@email.com">
      </label>

      <label>
        Chave de Acesso (Token)
        <input type="text" name="token" id="token" required placeholder="Insira sua chave de acesso">
      </label>

      <label>
        Envie seu currículo (PDF)
        <input type="file" id="curriculo" accept="application/pdf" required>
      </label>

      <label>
        Cole a descrição da vaga
        <textarea
          name="vaga"
          rows="10"
          placeholder="Cole aqui a descrição da vaga completa"
          required
        ></textarea>
      </label>

      <button type="submit">
        Gerar currículo
      </button>

    </form>

    <p id="statusMsg" style="display:none;margin-top:2rem;text-align:center;"></p>

  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
  const form = document.getElementById('cvForm');
  const statusMsg = document.getElementById('statusMsg');

  async function extractTextFromPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(' ');
      fullText += pageText + '\n\n';
    }
    return fullText;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const token = form.token.value;
    const nome = form.nome.value;
    const nomeVaga = form.nome_vaga.value;
    const email = form.email.value;
    const vaga = form.vaga.value;

    const fileInput = document.getElementById('curriculo');
    const file = fileInput.files[0];

    if (!file || file.type !== 'application/pdf') {
      alert('Envie um currículo em PDF.');
      return;
    }

    statusMsg.style.display = 'block';
    statusMsg.innerText = 'Processando currículo...';

    try {
      const curriculoTexto = await extractTextFromPDF(file);
      statusMsg.innerText = 'Validando token e enviando para análise...';

      const response = await fetch('http://localhost:5678/webhook/gerar-cv', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Auth-Token': token // Envio do Token no Header
        },
        body: JSON.stringify({
          nome,
          nome_vaga: nomeVaga,
          email,
          vaga,
          curriculo_texto: curriculoTexto
        })
      });

      // Se o n8n retornar erro de autorização
      if (response.status === 401 || response.status === 403) {
        throw new Error('Token inválido ou expirado.');
      }

      form.style.display = 'none';
      statusMsg.innerText = '✅ Tudo certo! Aguarde alguns minutos para receber seu currículo no e-mail.';

    } catch (err) {
      console.error(err);
      statusMsg.innerText = '❌ Não foi possível validar seu token. :(';
    }
  });
</script>
</body>
</html>
