<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gere seu currículo otimizado em segundos</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="page-default smart-cv">

<section class="section">
  <div class="container">
    <h1>Gere seu currículo otimizado em segundos</h1>
    <p style="text-align:center">
      Envie seu currículo e a descrição da vaga.<br>
      Você receberá o currículo adaptado para ATS via e-mail.
    </p>

    <form id="cvForm" class="form-box">
      <label>
        Seu nome
        <input type="text" name="nome" required placeholder="Seu nome completo">
      </label>

      <label>
        Seu perfil do LinkedIn
        <input type="url" name="linkedin_url" required placeholder="https://www.linkedin.com/in/seu-perfil">
      </label>

      <label>
        Nome da vaga
        <input type="text" name="nome_vaga" required placeholder="Ex: Analista de Dados Júnior">
      </label>

      <label>
        Seu e-mail
        <input type="email" name="email" required placeholder="seuemail@email.com">
      </label>

      <label>
        Chave de acesso
        <input type="text" name="token" required placeholder="Insira seu token">
      </label>

      <label>
        Envie seu currículo (PDF)
        <input type="file" id="curriculo" accept="application/pdf" required>
      </label>

      <label>
        Cole a descrição da vaga
        <textarea name="vaga" rows="8" required></textarea>
      </label>

      <button type="submit">Gerar currículo</button>
    </form>

    <p id="statusMsg" style="display:none;margin-top:2rem;text-align:center;"></p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script>
const form = document.getElementById('cvForm');
const statusMsg = document.getElementById('statusMsg');

async function extractTextFromPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    const pageText = textContent.items.map(item => item.str).join(' ');
    fullText += pageText + '\n\n';
  }
  return fullText;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const nome = form.nome.value;
  const linkedin_url = form.linkedin_url.value; // Captura o valor do novo campo
  const nomeVaga = form.nome_vaga.value;
  const email = form.email.value;
  const token = form.token.value;
  const vaga = form.vaga.value;
  const file = document.getElementById('curriculo').files[0];

  if (!file) {
    alert('Envie um PDF.');
    return;
  }

  statusMsg.style.display = 'block';
  statusMsg.innerText = 'Processando currículo...';

  try {
    const curriculoTexto = await extractTextFromPDF(file);
    statusMsg.innerText = 'Enviando para análise...';

    const response = await fetch('http://localhost:5678/webhook/gerar-cv', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Auth-Token': token
      },
      body: JSON.stringify({
        nome,
        linkedin_url, // Envia para o n8n
        nome_vaga: nomeVaga,
        email,
        vaga,
        curriculo_texto: curriculoTexto
      })
    });

    if (!response.ok) {
      throw new Error('Erro HTTP: ' + response.status);
    }

    form.style.display = 'none';
    statusMsg.innerHTML = '<b style="color:green">✅ Tudo certo! Aguarde o currículo no seu e-mail.</b>';

  } catch (err) {
    console.error('ERRO REAL:', err);
    alert(err.message);
  }
});
</script>
</body>
</html>
