<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Seu currículo perfeito para a vaga em segundos</title>
</head>
<body>

  <h1>Gerar currículo otimizado para vaga</h1>

  <form action="http://localhost:5678/webhook/gerar-cv" method="post" enctype="multipart/form-data">

    <label>Envie seu currículo (PDF ou DOCX)</label><br>
    <input type="file" name="curriculo" required><br><br>

    <label>Cole a descrição da vaga</label><br>
    <textarea name="vaga" rows="15" cols="80" required></textarea><br><br>

    <button type="submit">Gerar currículo</button>

  </form>

</body>
</html>
